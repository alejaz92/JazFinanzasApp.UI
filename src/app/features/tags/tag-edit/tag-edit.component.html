<app-loading [isLoading]="isLoading"></app-loading>
<div class="container mt-4" *ngIf="!isLoading">
    <div class="d-flex justify-content-between align-items-center mt-3 mb-3">
        <h1 class="mb-0">Editar Etiqueta</h1>
        <app-back-button [defaultUrl]="['/management/tags']"></app-back-button>
    </div>
    <ng-container *ngIf="tag; else notFound">
        <form #form="ngForm" (ngSubmit)="onFormSubmit()">
            <div class="mt-3">
                <label for="tagName" class="form-label">Nombre <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="tagName" name="tagName"
                    [(ngModel)]="tag.name" required>
            </div>
            <div class="mt-3">
                <label for="tagColor" class="form-label">Color</label>
                <input type="color" class="form-control form-control-color" id="tagColor" name="tagColor"
                    [ngModel]="tag.color || '#5B3DD9'" (ngModelChange)="tag.color = $event">
            </div>
            <div class="text-end mt-4">
                <app-submit-button [loading]="isSubmitting" [disabled]="!form.valid" label="Guardar" loadingLabel="Guardando..." btnClass="btn btn-primary"></app-submit-button>
            </div>
        </form>
    </ng-container>
    <ng-template #notFound>
        <div class="alert alert-warning" role="alert">
            La etiqueta no ha sido encontrada.
        </div>
    </ng-template>
</div>
