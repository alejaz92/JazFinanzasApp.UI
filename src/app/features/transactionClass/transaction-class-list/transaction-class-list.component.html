<app-loading [isLoading]="isLoading"></app-loading>

<div class="container mt-4" *ngIf="!isLoading">
    <div class="d-flex align-items-center gap-2 mb-3">
        <h1 class="mb-0">Clases de Movimiento</h1>
        <a class="btn btn-primary rounded-circle d-flex align-items-center justify-content-center"
           [routerLink]="['/management/transactionClass/add']"
           title="Crear Clase de Movimiento"
           style="width: 44px; height: 44px; font-size: 1.2rem;">
            <i class="bi-plus-lg text-white"></i>
        </a>
    </div>

    <div class="row">
        <div class="col-md-6" *ngIf="incomeGroups.length > 0">
            <h3>Ingresos</h3>
            <div class="table-responsive">
                <table class="table table-striped table-bordered">
                    <thead>
                        <tr>
                            <th>Descripcion</th>
                            <th class="text-nowrap" style="width: 110px;">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <ng-container *ngFor="let group of incomeGroups">
                            <tr>
                                <td class="align-middle">{{ group.parent.description }}</td>
                                <td class="align-middle">
                                    <ng-container *ngIf="canEditOrDelete(group.parent)">
                                        <div class="d-flex justify-content-center gap-2">
                                            <a title="Editar" class="btn-icon bg-primary" [routerLink]="['/management/transactionClass',group.parent.id]">
                                                <i class="bi-pencil-square"></i>
                                            </a>
                                            <button title="Eliminar" class="btn-icon bg-danger" [disabled]="!canDelete(group)"
                                                    [attr.title]="canDelete(group) ? 'Eliminar' : 'No se puede eliminar: tiene subcategorías'"
                                                    (click)="onDelete(group.parent.id)">
                                                <i class="bi-trash"></i>
                                            </button>
                                        </div>
                                    </ng-container>
                                </td>
                            </tr>
                            <tr *ngFor="let child of group.children">
                                <td class="align-middle ps-4 text-muted">
                                    <i class="bi-arrow-return-right me-1"></i>{{ child.description }}
                                </td>
                                <td class="align-middle">
                                    <ng-container *ngIf="canEditOrDelete(child)">
                                        <div class="d-flex justify-content-center gap-2">
                                            <a title="Editar" class="btn-icon bg-primary" [routerLink]="['/management/transactionClass',child.id]">
                                                <i class="bi-pencil-square"></i>
                                            </a>
                                            <button title="Eliminar" class="btn-icon bg-danger" (click)="onDelete(child.id)">
                                                <i class="bi-trash"></i>
                                            </button>
                                        </div>
                                    </ng-container>
                                </td>
                            </tr>
                        </ng-container>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="col-md-6" *ngIf="expenseGroups.length > 0">
            <h3>Egresos</h3>
            <div class="table-responsive">
                <table class="table table-striped table-bordered">
                    <thead>
                        <tr>
                            <th>Descripcion</th>
                            <th class="text-nowrap" style="width: 110px;">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <ng-container *ngFor="let group of expenseGroups">
                            <tr>
                                <td class="align-middle">{{ group.parent.description }}</td>
                                <td class="align-middle">
                                    <ng-container *ngIf="canEditOrDelete(group.parent)">
                                        <div class="d-flex justify-content-center gap-2">
                                            <a title="Editar" class="btn-icon bg-primary" [routerLink]="['/management/transactionClass',group.parent.id]">
                                                <i class="bi-pencil-square"></i>
                                            </a>
                                            <button title="Eliminar" class="btn-icon bg-danger" [disabled]="!canDelete(group)"
                                                    [attr.title]="canDelete(group) ? 'Eliminar' : 'No se puede eliminar: tiene subcategorías'"
                                                    (click)="onDelete(group.parent.id)">
                                                <i class="bi-trash"></i>
                                            </button>
                                        </div>
                                    </ng-container>
                                </td>
                            </tr>
                            <tr *ngFor="let child of group.children">
                                <td class="align-middle ps-4 text-muted">
                                    <i class="bi-arrow-return-right me-1"></i>{{ child.description }}
                                </td>
                                <td class="align-middle">
                                    <ng-container *ngIf="canEditOrDelete(child)">
                                        <div class="d-flex justify-content-center gap-2">
                                            <a title="Editar" class="btn-icon bg-primary" [routerLink]="['/management/transactionClass',child.id]">
                                                <i class="bi-pencil-square"></i>
                                            </a>
                                            <button title="Eliminar" class="btn-icon bg-danger" (click)="onDelete(child.id)">
                                                <i class="bi-trash"></i>
                                            </button>
                                        </div>
                                    </ng-container>
                                </td>
                            </tr>
                        </ng-container>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>

<app-confirm-modal #deleteModal
    title="Eliminar Clase de Movimiento"
    message="¿Está seguro de eliminar esta clase de movimiento?"
    confirmLabel="Eliminar"
    (confirmed)="onDeleteConfirmed()">
</app-confirm-modal>
