
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mt-3 mb-3">
        <h1 class="mb-0">Crear Clase de Movimiento</h1>
        <app-back-button [defaultUrl]="['/management/transactionClass']"></app-back-button>
    </div>
    <form #form="ngForm" (ngSubmit)="onFormSubmit()">
        <div class="mt-2">
            <div class="mt-3">
                <label for="transactionClassDescription" class="form-label">Descripción</label>
                <input type="text"
                    class="form-control"
                    id="transactionClassDescription"
                    name="transactionClassDescription"
                    [(ngModel)]="model.description">
            </div>
        </div>
        <!-- select between ingreso o egreso (value I o E) para el campo incExp-->
        <div class="mt-3">
            <label for="transactionClassIncExp" class="form-label">Tipo</label>
            <select
                class="form-select"
                id="transactionClassIncExp"
                name="transactionClassIncExp"
                [(ngModel)]="model.incExp"
                (ngModelChange)="model.parentId = null">
                <option value="I">Ingreso</option>
                <option value="E">Egreso</option>
            </select>
        </div>

        <div class="mt-3">
            <label for="transactionClassParent" class="form-label">Rubro (opcional)</label>
            <select
                class="form-select"
                id="transactionClassParent"
                name="transactionClassParent"
                [(ngModel)]="model.parentId">
                <option [ngValue]="null">Sin rubro</option>
                <option *ngFor="let rubro of parentOptions" [ngValue]="rubro.id">{{ rubro.description }}</option>
            </select>
        </div>

        <div class="mt-3 form-check">
            <input type="checkbox"
                class="form-check-input"
                id="transactionClassCountsAsIncomeExpense"
                name="transactionClassCountsAsIncomeExpense"
                [(ngModel)]="model.countsAsIncomeExpense">
            <label class="form-check-label" for="transactionClassCountsAsIncomeExpense">
                Cuenta como ingreso/egreso en los reportes
            </label>
            <div class="form-text">Desmarcá esto solo para categorías que no representan un ingreso o gasto real (ej. ajustes de saldo).</div>
        </div>

        <div class="text-end mt-3">
            <app-submit-button [loading]="isSubmitting" label="Insertar" loadingLabel="Insertando..." btnClass="btn btn-primary m-1"></app-submit-button>
        </div>
    </form>
</div>
