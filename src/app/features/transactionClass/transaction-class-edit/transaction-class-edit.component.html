<app-loading [isLoading]="isLoading"></app-loading>

<div class="container mt-4" *ngIf="!isLoading">
    <div class="d-flex justify-content-between align-items-center mt-3 mb-3">
        <h1 class="mb-0">Editar Clase de Movimiento</h1>
        <app-back-button [defaultUrl]="['/management/transactionClass']"></app-back-button>
    </div>
    <ng-container *ngIf="transactionClass;else notFound">
        <form #form="ngForm" (ngSubmit)="onFormSubmit()">
            <div class="mt-2">
                <div class="mt-3">
                    <label class="form-label" for="transactionClassDescription">Descripción</label>
                    <input type="text" class="form-control" id="transactionClassDescription" [(ngModel)]="transactionClass.description" name="transactionClassDescription">
                </div>
                <div class="mt-3">
                    <label class="form-label" for="transactionClassIncExp">Tipo</label>
                    <select class="form-select" id="transactionClassIncExp" name="transactionClassIncExp" [(ngModel)]="transactionClass.incExp" disabled>
                        <option value="I">Ingreso</option>
                        <option value="E">Egreso</option>
                    </select>
                </div>

                <div class="mt-3">
                    <label class="form-label" for="transactionClassParent">Rubro (opcional)</label>
                    <select
                        class="form-select"
                        id="transactionClassParent"
                        name="transactionClassParent"
                        [(ngModel)]="transactionClass.parentId"
                        [disabled]="hasChildren">
                        <option [ngValue]="null">Sin rubro</option>
                        <option *ngFor="let rubro of parentOptions" [ngValue]="rubro.id">{{ rubro.description }}</option>
                    </select>
                    <div class="form-text" *ngIf="hasChildren">
                        Esta categoría ya es un rubro de otras — no puede colgar de otro rubro (máximo dos niveles).
                    </div>
                </div>

                <div class="mt-3 form-check">
                    <input type="checkbox"
                        class="form-check-input"
                        id="transactionClassCountsAsIncomeExpense"
                        name="transactionClassCountsAsIncomeExpense"
                        [(ngModel)]="transactionClass.countsAsIncomeExpense">
                    <label class="form-check-label" for="transactionClassCountsAsIncomeExpense">
                        Cuenta como ingreso/egreso en los reportes
                    </label>
                    <div class="form-text">Desmarcá esto solo para categorías que no representan un ingreso o gasto real (ej. ajustes de saldo).</div>
                </div>

                <div class="text-end mt-3">
                    <app-submit-button [loading]="isSubmitting" label="Guardar" loadingLabel="Guardando..." btnClass="btn btn-primary m-1"></app-submit-button>
                </div>
            </div>
        </form>
    </ng-container>
    <ng-template #notFound>
        <div class="alert alert-warning" role="alert">
            La clase de movimiento no ha sido encontrada.
        </div>
    </ng-template>
</div>
