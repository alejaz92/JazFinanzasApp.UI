<app-loading [isLoading]="isLoading"></app-loading>

<div class="container mt-4" *ngIf="!isLoading">
    <div class="d-flex align-items-center gap-2 mb-3">
        <h1 class="mb-0">Etiquetas</h1>
        <a class="btn btn-primary rounded-circle d-flex align-items-center justify-content-center"
           [routerLink]="['/management/tag/add']"
           title="Crear Etiqueta"
           style="width: 44px; height: 44px; font-size: 1.2rem;">
            <i class="bi-plus-lg text-white"></i>
        </a>
    </div>

    <div class="table-responsive" *ngIf="tags && tags.length > 0">
        <table class="table table-striped table-bordered">
            <thead>
                <tr>
                    <th>Etiqueta</th>
                    <th class="text-nowrap" style="width: 110px;">Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let tag of tags">
                    <td class="align-middle">
                        <span class="badge" [style.background-color]="tag.color || '#6c757d'">{{ tag.name }}</span>
                    </td>
                    <td class="align-middle">
                        <div class="d-flex justify-content-center gap-2">
                            <a title="Editar" class="btn-icon bg-primary" [routerLink]="['/management/tag', tag.id]">
                                <i class="bi-pencil-square"></i>
                            </a>
                            <button title="Eliminar" class="btn-icon bg-danger" (click)="onDelete(tag.id)">
                                <i class="bi-trash"></i>
                            </button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <p *ngIf="tags && tags.length === 0" class="text-body-secondary">Todavía no creaste ninguna etiqueta.</p>
</div>

<app-confirm-modal #deleteModal
    title="Eliminar Etiqueta"
    message="¿Está seguro de eliminar esta etiqueta? Se va a sacar de todos los movimientos y consumos donde esté asignada."
    confirmLabel="Eliminar"
    (confirmed)="onDeleteConfirmed()">
</app-confirm-modal>
