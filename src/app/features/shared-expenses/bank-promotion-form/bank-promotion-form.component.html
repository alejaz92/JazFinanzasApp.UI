<div class="bank-promotion-form">
  <div class="row mb-2">
    <div class="col-12">
      <label class="form-label">¿Dónde acreditó el banco el reintegro?</label>
      <div class="d-flex gap-3 flex-wrap">
        <div class="form-check">
          <input class="form-check-input" type="radio" name="bankPromotionCreditTarget"
                 id="creditTargetAccount" value="ACCOUNT"
                 [(ngModel)]="creditTarget" (ngModelChange)="onCreditTargetChange()">
          <label class="form-check-label" for="creditTargetAccount">En una cuenta</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="bankPromotionCreditTarget"
                 id="creditTargetCard" value="CARD"
                 [(ngModel)]="creditTarget" (ngModelChange)="onCreditTargetChange()">
          <label class="form-check-label" for="creditTargetCard">Sobre el saldo de la tarjeta</label>
        </div>
      </div>
    </div>
  </div>

  <div class="row mb-2">
    <div class="col-md-6">
      <label class="form-label">Monto devuelto por el banco</label>
      <div class="input-group input-group-sm">
        <span class="input-group-text">$</span>
        <input type="number" class="form-control" name="bankPromotionAmount"
               [(ngModel)]="amount" (ngModelChange)="onChange()"
               min="0.01" step="0.01">
      </div>
    </div>
    <div class="col-md-6">
      <label class="form-label">Fecha de acreditación</label>
      <input type="date" class="form-control form-control-sm" name="bankPromotionDate"
             [(ngModel)]="date" (ngModelChange)="onChange()">
    </div>
  </div>

  <div class="row mb-2" *ngIf="acreditaEnCuenta">
    <div class="col-md-6">
      <label class="form-label">Cuenta donde se acreditó</label>
      <select class="form-select form-select-sm" name="bankPromotionAccount"
              [(ngModel)]="accountId" (ngModelChange)="onChange()">
        <option value="" disabled selected>Seleccione</option>
        <option *ngFor="let a of accounts" [value]="a.id">{{ a.name }}</option>
      </select>
    </div>
  </div>

  <small class="text-muted" *ngIf="acreditaEnCuenta">
    El banco acreditó este monto en la cuenta al momento de la compra; se descontará de las próximas cuotas hasta agotarse.
  </small>
  <small class="text-muted" *ngIf="!acreditaEnCuenta">
    El monto queda como saldo a favor de la tarjeta. No se registra ningún movimiento todavía: se va a descontar
    cuando el resumen lo absorba, o cuando pases esa plata a una cuenta.
  </small>

  <div class="mt-3 mb-0">
    <label class="form-label">Notas (opcional)</label>
    <textarea class="form-control form-control-sm" name="bankPromotionNotes"
              [(ngModel)]="notes" rows="2" (ngModelChange)="onChange()"></textarea>
  </div>
</div>
