<div class="container">
    <div class="d-flex justify-content-between align-items-center mt-3 mb-3">
        <h1 class="mb-0">Crear Cuenta</h1>
        <app-back-button [defaultUrl]="['/management/account']"></app-back-button>
    </div>
    <form #form="ngForm" (ngSubmit)="onFormSubmit()">
        <div class="mt-2">
            <div class="mt-3">
                <label for="accountName" class="form-label">Nombre</label>
                <input type="text" class="form-control" id="accountName" name="accountName"
                [(ngModel)]="model.name">
            </div>
            <div class="mt-3">
                <label for="accountType" class="form-label">Tipo</label>
                <select class="form-select" id="accountType" name="accountType" [(ngModel)]="model.type">
                    <option [ngValue]="null">Sin asignar</option>
                    <option *ngFor="let type of types" [ngValue]="type">{{ typeLabels[type] }}</option>
                </select>
            </div>
            <div class="mt-3 form-check form-switch">
                <input class="form-check-input" type="checkbox" id="accountCountsAsLiquid"
                       name="accountCountsAsLiquid" [(ngModel)]="model.countsAsLiquid">
                <label class="form-check-label" for="accountCountsAsLiquid">Cuenta como plata disponible</label>
            </div>
        </div>
        <div class="text-end mt-3">
            <app-submit-button [loading]="isSubmitting" label="Insertar" loadingLabel="Insertando..." btnClass="btn btn-primary m-1"></app-submit-button>
        </div>
    </form>
</div>
