<app-loading [isLoading]="isLoading"></app-loading>

<div *ngIf="!isLoading">
    <h2 class="mb-3">Tarjetas — Compromiso futuro</h2>

    <ng-container *ngIf="hasCommitment; else emptyState">
        <div class="row">
            <div class="col-12 mt-1">
                <div class="card">
                    <div class="card-header">Cuotas por vencer, próximos meses</div>
                    <div class="card-body">
                        <app-chart [options]="stackedOptions" [height]="320"></app-chart>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col-12 mt-1">
                <div class="card">
                    <div class="card-header">Cronograma</div>
                    <div class="card-body">
                        <app-chart [options]="ganttOptions" [height]="ganttHeight"></app-chart>
                    </div>
                </div>
            </div>
        </div>
    </ng-container>

    <ng-template #emptyState>
        <div class="text-center text-body-secondary py-5">
            <i class="bi bi-check-circle fs-1 d-block mb-2"></i>
            <p class="mb-0">No tenés compras en cuotas pendientes de vencer.</p>
            <p class="mb-0">Este reporte se llena solo el día que aparezca una compra grande a pagar en varias cuotas.</p>
        </div>
    </ng-template>
</div>
