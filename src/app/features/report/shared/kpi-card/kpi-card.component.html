<div class="card shadow-sm h-100 kpi-card" [class.kpi-card-clickable]="routerLink" [routerLink]="routerLink ?? undefined">
    <div class="card-body d-flex flex-column">
        <p class="text-muted small mb-1">{{ title }}</p>
        <div class="d-flex align-items-end justify-content-between">
            <h3 class="mb-0 fw-bold" [class]="valueClass">{{ value }}</h3>
            @if (sparklinePoints) {
                <svg class="kpi-sparkline" viewBox="0 0 100 28" preserveAspectRatio="none">
                    <polyline [attr.points]="sparklinePoints" fill="none" stroke="currentColor" stroke-width="2" />
                </svg>
            }
        </div>
        <div class="d-flex align-items-center gap-2 mt-1">
            @if (subtitle) {
                <small class="text-muted">{{ subtitle }}</small>
            }
            @if (variationPct !== null) {
                <small [class.text-success]="variationPct >= 0" [class.text-danger]="variationPct < 0">
                    <i class="bi" [class.bi-arrow-up-short]="variationPct >= 0" [class.bi-arrow-down-short]="variationPct < 0"></i>
                    {{ (variationPct >= 0 ? '+' : '') + variationPct.toFixed(1) }}%
                </small>
            }
        </div>
    </div>
</div>
