<div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
    <h2 class="mb-0">Ingresos</h2>
    <div class="d-flex align-items-center gap-2">
        <button class="btn btn-sm btn-outline-secondary" (click)="previousMonth()"><i class="bi-chevron-left"></i></button>
        <span class="text-capitalize fw-semibold">{{ monthLabel }}</span>
        <button class="btn btn-sm btn-outline-secondary" (click)="nextMonth()"><i class="bi-chevron-right"></i></button>
    </div>
</div>

<p class="text-body-secondary" *ngIf="!dataRequested">Elegí una moneda arriba para ver tus ingresos.</p>

<app-loading [isLoading]="isLoading"></app-loading>

<ng-container *ngIf="dataRequested && !isLoading">
    <!-- Composición del mes elegido: lo principal -->
    <p class="text-body-secondary small" *ngIf="composition && composition.categories.length === 0">
        No hay ingresos categorizados en {{ monthLabel }}.
    </p>

    <div class="card mb-3" *ngIf="composition && composition.categories.length > 0">
        <div class="card-header d-flex justify-content-between align-items-center">
            <span>Composición de {{ monthLabel }}</span>
            <span class="fw-semibold">{{ compositionTotal | currencyFiatFormat }}</span>
        </div>
        <div class="card-body">
            <app-chart [options]="compositionOptions" [height]="320"></app-chart>
        </div>
    </div>

    <!-- Evolución en el tiempo: secundaria -->
    <div class="card" *ngIf="categories.length > 0">
        <div class="card-header text-body-secondary">Evolución por categoría — últimos 24 meses</div>
        <div class="card-body">
            <app-chart [options]="evolutionOptions" [height]="260"></app-chart>
        </div>
    </div>
</ng-container>
